version: 1
secrets:
  github.token:
    provider: github
    environment: [development, staging, production]
    source: environment
    required: false
    scopes: [github.rest.user]
    rotation_days: 90
  sportmonks.token:
    provider: sportmonks
    environment: [development, staging, production]
    source: environment
    required: false
    scopes: [football.live, football.fixtures]
    rotation_days: 90
  database.url:
    provider: postgres
    environment: [development, staging, production]
    source: environment
    required: false
    scopes: [database.read, database.write]
    rotation_days: 180
