name: Run Tests

on:
  push:
    branches: [ "main", "automation-staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ois_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ois_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OIS_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/ois_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: pytest -v
