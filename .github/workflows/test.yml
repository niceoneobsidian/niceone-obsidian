name: Run Tests

on:
  push:
    branches:
      - main
      - automation-staging
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pytest

      - name: Install OIS package
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m pip install -e .
          fi

      - name: Validate package import
        run: |
          python -c "import ois_kernel; print('OIS Kernel import: OK')"

      - name: Validate public exports
        run: |
          python - <<'PY'
          import ois_kernel

          missing = [
              name
              for name in ois_kernel.__all__
              if not hasattr(ois_kernel, name)
          ]

          if missing:
              print("Missing public exports:")
              for name in missing:
                  print(f"  - {name}")
              raise SystemExit(1)

          print(f"Validated {len(ois_kernel.__all__)} public exports")
          PY

      - name: Run tests
        run: |
          python -m pytest -v