name: OIS Verification

on:
  push:
    branches: [ "main", "automation-staging" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ois_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ois_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OIS_POSTGRES_DSN: postgresql://postgres@localhost:5432/ois_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Run canonical OIS verification
        run: ois verify --artifact .ois/evidence/verification.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ois-verification-evidence
          path: .ois/evidence/verification.json
          if-no-files-found: error