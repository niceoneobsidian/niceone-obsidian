name: OIS Security Hardening

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  static-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[test,security]" && pip install pip-audit cyclonedx-bom
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy ois/security/secrets ois/kernel/contracts.py ois/kernel/runtime.py
      - run: pytest -q
      - run: pytest -q tests/security -k "security or hardening or conformance"
      - run: pip-audit
      - run: cyclonedx-py environment --output-format json --output-file ois-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: ois-security-sbom
          path: ois-sbom.json

  gitleaks-full-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fsck --full --strict
      - run: git diff --check
      - name: Verify workflow pinning
        shell: bash
        run: '! grep -RInE "uses:[[:space:]]+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@(main|master|latest)" .github/workflows'
