name: Ruff

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  ruff:
    name: Ruff Lint and Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade pip "ruff==0.9.10"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .
