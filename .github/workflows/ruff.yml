name: Ruff

on:
  push:
    branches: [main, dev/de-03-postgres-fenced-execution]
  pull_request:
    branches: [main, dev/de-03-postgres-fenced-execution]

permissions: {}

concurrency:
  group: ci-ruff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff Lint and Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Ruff
        run: python -m pip install --upgrade pip "ruff==0.9.10"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .
