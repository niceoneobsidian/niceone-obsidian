name: Kernel Conformance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-conformance:
    name: Kernel Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run kernel conformance tests
        run: python -m pytest -q tests/conformance

      - name: Run architecture boundary tests
        run: python -m pytest -q tests/architecture

      - name: Run PostgreSQL recovery and outbox conformance
        run: python -m pytest -q tests/integration/test_postgres_outbox_worker.py
