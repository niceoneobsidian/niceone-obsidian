name: kernel-conformance

on:
  pull_request:
    branches: [main, phase/lock-in-implementation-sequence]
  push:
    branches: [main, phase/lock-in-implementation-sequence, phase/kernel-conformance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-conformance:
    name: kernel-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python sources
        run: python -m compileall -q ois tests/governance/test_kernel_conformance.py
      - name: Run kernel conformance suite
        run: python -m pytest -q tests/governance/test_kernel_conformance.py
