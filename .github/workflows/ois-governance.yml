name: OIS Governance

on:
  pull_request:
    branches: [main]

# Explicitly declare safe default permissions
permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ois_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ois_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OIS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/ois_test

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Checkout OCIF PostgreSQL consumer for restart conformance
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: niceoneobsidian/obsidian-content-intelligence-factory
        ref: 5fc994562b87a409011d02b8c25bfe4df729c520
        path: ocif_repo

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"
        python -m pip install -e "./ocif_repo[postgres]"

    - name: Run governance gate
      run: python scripts/ois_governance_check.py

    - name: Run test suite
      run: python -m pytest -q
