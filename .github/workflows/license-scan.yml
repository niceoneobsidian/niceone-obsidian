name: License Compliance Scan

on:
  push:
    branches: ["main", "automation-staging"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-license-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install "pip-licenses==5.5.0"

      - name: Scan licenses
        run: |
          pip-licenses --format=markdown --output-file=THIRD_PARTY_NOTICES.md
          echo "Checking for copyleft licenses..."
          if pip-licenses --format=csv | grep -Ei "GPL|AGPL"; then
            echo "::error::Copyleft (GPL/AGPL) dependency detected — review before merging."
            exit 1
          else
            echo "No GPL/AGPL dependencies found."
          fi

      - name: Upload notices
        uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
