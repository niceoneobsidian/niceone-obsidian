name: License Compliance Scan

permissions:
  contents: read

on:
  push:
    branches: [ "main", "automation-staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pip-licenses

      - name: Scan licenses
        run: |
          pip-licenses --format=markdown --output-file=THIRD_PARTY_NOTICES.md
          echo "Checking for copyleft licenses..."
          if pip-licenses --format=csv | grep -Ei "GPL|AGPL"; then
            echo "::error::Copyleft (GPL/AGPL) dependency detected — review before merging."
            exit 1
          else
            echo "No GPL/AGPL dependencies found."
          fi

      - name: Upload notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
