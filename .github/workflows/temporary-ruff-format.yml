name: Temporary Ruff Format Repair

on:
  push:
    branches:
      - canonical/persistence-stabilization

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: autoformat persistence files')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade pip "ruff==0.9.10"

      - name: Format persistence files
        run: python -m ruff format ois/kernel/postgres.py ois/persistence/redis_coordinator.py tests/integration/test_persistence_coordination.py

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git add ois/kernel/postgres.py ois/persistence/redis_coordinator.py tests/integration/test_persistence_coordination.py
          git commit -m "style: autoformat persistence files"
          git push origin HEAD:canonical/persistence-stabilization
