name: Verify immutable GitHub Action references

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-pinning:
    name: Verify immutable action pins
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject mutable action references
        shell: python
        run: |
          from pathlib import Path
          import re
          pattern = re.compile(r"^\s*uses:\s*([^\s#]+)", re.MULTILINE)
          bad = []
          for path in Path(".github/workflows").glob("*.yml"):
              for ref in pattern.findall(path.read_text()):
                  owner_action, version = ref.rsplit("@", 1)
                  if not re.fullmatch(r"[0-9a-fA-F]{40}", version):
                      bad.append(f"{path}: {owner_action}@{version}")
          if bad:
              print("Mutable GitHub Action references detected:")
              print("\n".join(bad))
              raise SystemExit(1)
