name: architecture-and-conformance

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          which python3.12 || which python3
          python3.12 -m venv .venv || python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run architecture, conformance, and integration tests
        run: |
          python -m pytest \
            tests/architecture \
            tests/conformance \
            tests/integration \
            -q
