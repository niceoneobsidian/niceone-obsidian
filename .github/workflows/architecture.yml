name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install architecture test dependencies
        run: python -m pip install --upgrade pip pydantic pytest
      - name: Run architecture contracts
        run: python -m pytest tests/architecture -q
