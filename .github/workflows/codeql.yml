name: CodeQL

# CodeQL is retained as an optional/manual security workflow.
# It is intentionally excluded from pull-request CI because GitHub Code Security
# is not available for this private personal-account repository.
# The workflow remains structurally ready for activation if Code Security becomes available.

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
