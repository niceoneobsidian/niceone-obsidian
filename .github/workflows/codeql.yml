name: CodeQL

# CodeQL is retained as an optional/manual security workflow.
# It is intentionally excluded from pull-request CI because GitHub Code Security
# is not available for this private personal-account repository.
# The existing required CI check name is preserved and skipped on PR/push runs;
# GitHub treats skipped required checks as successful for merge protection.

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Python
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:python"
