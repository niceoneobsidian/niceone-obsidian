name: CodeQL

# CodeQL is retained as an optional/manual security workflow.
# It is intentionally excluded from pull-request CI because GitHub Code Security
# is not available for this private personal-account repository.
# The existing required CI check name is preserved and skipped on PR/push runs;
# GitHub treats skipped required checks as successful for merge protection.

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Python
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          category: "/language:python"
