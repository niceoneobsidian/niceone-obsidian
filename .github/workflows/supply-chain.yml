name: Supply Chain

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies and audit tools
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install pip-audit cyclonedx-bom build

      - name: Audit dependencies
        run: python -m pip_audit --requirement requirements.lock

      - name: Build distributions
        run: python -m build --sdist --wheel --outdir dist

      - name: Generate CycloneDX SBOM
        run: python -m cyclonedx_py environment --of JSON --output-file sbom.cdx.json

      - name: Upload SBOM and distributions
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-artifacts
          if-no-files-found: error
          path: |
            sbom.cdx.json
            dist/*
