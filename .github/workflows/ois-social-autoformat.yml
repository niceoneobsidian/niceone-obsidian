name: OIS social branch autoformat

on:
  push:
    branches:
      - feat/m13-social-intelligence-fabric

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/m13-social-intelligence-fabric'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Format and lint-fix
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.9.10"
          ruff check . --fix || true
          ruff format .
      - name: Commit formatting
        run: |
          rm .github/workflows/ois-social-autoformat.yml
          git config user.name "Niceone Obsidian"
          git config user.email "niceoneobsidian@gmail.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format social intelligence implementation [skip ci]"
          git push
