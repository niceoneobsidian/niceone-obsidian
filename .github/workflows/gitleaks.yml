name: Gitleaks

on:
  push:
    branches: [main, dev/de-03-postgres-fenced-execution]
  pull_request:
    branches: [main, dev/de-03-postgres-fenced-execution]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions: {}

concurrency:
  group: ci-gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Full Git history scan
        run: |
          gitleaks git             --redact             --exit-code 1             --report-format sarif             --report-path full-history-results.sarif             --log-opts="--all"

      - name: Upload full-history report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-full-history
          path: full-history-results.sarif
          if-no-files-found: error
