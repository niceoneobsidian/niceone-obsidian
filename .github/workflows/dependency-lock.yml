name: Dependency Lock

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements.lock"
      - ".github/workflows/dependency-lock.yml"
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - "requirements.lock"
      - ".github/workflows/dependency-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify package metadata resolves
        run: python -m pip install --no-deps --editable "."
