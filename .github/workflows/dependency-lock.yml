name: Dependency Lock

on:
  workflow_dispatch:
    inputs:
      write_lock:
        description: "Generate and commit uv.lock to this branch"
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.12.17"

      - name: Generate lockfile
        run: uv lock

      - name: Verify lockfile is reproducible
        run: uv lock --check

      - name: Commit lockfile when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.write_lock }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already current."
            exit 0
          fi
          git commit -m "build: add reproducible uv lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
