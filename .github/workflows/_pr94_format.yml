name: PR94 Format Regeneration

on:
  push:
    branches:
      - feat/ois-kernel-production-integration

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff==0.9.10"
      - name: Format
        run: python -m ruff format .
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/ois_production_kernel.py tests
          if git diff --cached --quiet; then
            echo "Formatting already current."
            exit 0
          fi
          git commit -m "style: format PR94 kernel changes"
          git push origin HEAD:feat/ois-kernel-production-integration
