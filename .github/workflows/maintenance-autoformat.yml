name: OIS maintenance autoformat

on:
  workflow_dispatch:
  push:
    branches:
      - feat/p0-production-spine

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Apply safe Ruff fixes
        run: |
          ruff check --fix ois scripts tests test_p0_integrated_spine.py test_p0_spine_e2e.py test_p0_supervisor_and_promotion.py test_p0_runtime_integrations.py
          ruff format ois scripts tests test_p0_integrated_spine.py test_p0_spine_e2e.py test_p0_supervisor_and_promotion.py test_p0_runtime_integrations.py
      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add -A
          git commit -m "chore: apply Ruff fixes to P0 implementation"
          git push
