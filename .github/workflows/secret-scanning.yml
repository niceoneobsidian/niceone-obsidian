name: OIS secret scanning

permissions:
  contents: read

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm             -v "$PWD:/repo"             ghcr.io/gitleaks/gitleaks:latest             detect --source /repo --redact --no-banner
