name: OIS P0 conformance

permissions:
  contents: read

on:
  push:
    branches: [feat/p0-integrated-spine, feat/persistence-coordination-conformance]
    branches: [feat/p0-recovery-conformance-final]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff mypy bandit pip-licenses
      - name: Ruff lint
        run: ruff check ois scripts tests test_p0_integrated_spine.py
      - name: Ruff format
        run: ruff format --check ois scripts tests test_p0_integrated_spine.py
      - name: Mypy
        run: python -m mypy ois
      - name: Bandit
        run: bandit -r ois scripts -x ./.git,./.venv,./venv,./tests -lll -iii
      - name: License compliance
        run: pip-licenses --format=csv
      - name: OIS governance
        run: python scripts/ois_governance_check.py
      - name: Full test suite
        run: python -m pytest -q
      - name: P0 deliberate failure and recovery
        run: python -m pytest -q test_p0_integrated_spine.py
      - name: Start PostgreSQL and Redis
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - name: Real persistence and coordination conformance
        env:
          OIS_DATABASE_URL: postgresql://ois_admin:ois_local_only@localhost:5432/ois_kernel_db
          OIS_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q tests/integration/test_persistence_coordination.py
      - name: Tear down infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
