name: OIS P0 conformance

on:
  push:
    branches: [feat/p0-integrated-spine]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff mypy bandit pip-licenses pytest
      - name: Ruff lint
        run: ruff check ois scripts tests test_p0_integrated_spine.py
      - name: Ruff format
        run: ruff format --check ois scripts tests test_p0_integrated_spine.py
      - name: Mypy
        run: python -m mypy ois
      - name: Bandit
        run: bandit -r ois scripts -x ./.git,./.venv,./venv,./tests -lll -iii
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: License compliance
        run: pip-licenses --format=csv
      - name: OIS governance
        run: python scripts/ois_governance_check.py
      - name: Full test suite
        run: python -m pytest -q
      - name: P0 deliberate failure and recovery
        run: python -m pytest -q test_p0_integrated_spine.py
