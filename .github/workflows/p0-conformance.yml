name: OIS P0 conformance

on:
  push:
    branches: [feat/p0-integrated-spine, dev/de-03-postgres-fenced-execution]
  pull_request:
    branches: [main, dev/de-03-postgres-fenced-execution]

permissions:
  contents: read

concurrency:
  group: ci-p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ois_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ois_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OIS_POSTGRES_DSN: postgresql://postgres@localhost:5432/ois_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install "ruff==0.9.10" "mypy==1.17.1" "bandit==1.8.6" "pip-licenses==5.5.0" "pytest==8.4.2"
      - name: Ruff lint
        run: ruff check ois scripts tests test_p0_integrated_spine.py
      - name: Ruff format
        run: ruff format --check ois scripts tests test_p0_integrated_spine.py
      - name: Mypy
        run: python -m mypy ois
      - name: Bandit
        run: bandit -r ois scripts -x ./.git,./.venv,./venv,./tests -lll -iii
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: License compliance
        run: pip-licenses --format=csv
      - name: OIS governance
        run: python scripts/ois_governance_check.py
      - name: Full test suite
        run: python -m pytest -q
      - name: P0 deliberate failure and recovery
        run: python -m pytest -q test_p0_integrated_spine.py
