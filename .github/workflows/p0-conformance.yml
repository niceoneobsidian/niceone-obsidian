name: OIS P0 conformance

on:
  push:
    branches: [main, feat/p0-production-spine]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ois
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ois"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OIS_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/ois
      OIS_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy bandit gitleaks pip-licenses pytest
      - name: Ruff lint
        run: ruff check ois scripts tests test_p0_integrated_spine.py test_p0_spine_e2e.py test_p0_supervisor_and_promotion.py
      - name: Ruff format
        run: ruff format --check ois scripts tests test_p0_integrated_spine.py test_p0_spine_e2e.py test_p0_supervisor_and_promotion.py
      - name: Mypy
        run: python -m mypy ois
      - name: Bandit
        run: bandit -r ois scripts -x ./.git,./.venv,./venv,./tests -lll -iii
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: License compliance
        run: pip-licenses --format=csv
      - name: OIS governance
        run: python scripts/ois_governance_check.py
      - name: Full test suite
        run: python -m pytest -q
      - name: PostgreSQL and Redis reachability
        run: |
          python - <<'PY'
          import os
          import psycopg
          import redis

          with psycopg.connect(os.environ["OIS_POSTGRES_TEST_DSN"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT 1")
                  assert cur.fetchone() == (1,)
          assert redis.Redis.from_url(os.environ["OIS_REDIS_URL"]).ping() is True
          PY
      - name: Emit evidence status
        run: |
          mkdir -p artifacts
          cat > artifacts/p0-evidence.json <<'JSON'
          {
            "status": "TESTED",
            "production_promotable": false,
            "reason": "CI verifies implementation, tests, static security checks, and service reachability. Production runtime, deployment, rollback, and operational evidence are still required."
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: p0-evidence
          path: artifacts/p0-evidence.json
