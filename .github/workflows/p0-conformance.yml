name: OIS P0 conformance

permissions:
  contents: read

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ois_admin
          POSTGRES_PASSWORD: ois_local_only
          POSTGRES_DB: ois_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ois_admin -d ois_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      OIS_TEST_DATABASE_URL: postgresql://ois:ois@localhost:5432/ois_test
      OIS_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Provision non-superuser test role
        env:
          PGPASSWORD: ois_local_only
        run: |
          psql -h localhost -U ois_admin -d ois_test -v ON_ERROR_STOP=1             -c "CREATE ROLE ois LOGIN PASSWORD 'ois' NOSUPERUSER NOBYPASSRLS;"             -c "GRANT CONNECT ON DATABASE ois_test TO ois;"             -c "GRANT USAGE, CREATE ON SCHEMA public TO ois;"
      - name: Install project and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy bandit pip-licenses pytest pytest-asyncio
          python -m pip install -e ".[test]"
          python -m pip install "ruff==0.16.9" mypy bandit pip-licenses
      - name: Ruff lint
        run: ruff check ois scripts tests test_p0_integrated_spine.py
      - name: Ruff format
        run: ruff format --check ois scripts tests test_p0_integrated_spine.py
      - name: Mypy
        run: python -m mypy ois ops production
      - name: Bandit
        run: bandit -r ois scripts -x ./.git,./.venv,./venv,./tests -lll -iii
      - name: License compliance
        run: pip-licenses --format=csv
      - name: OIS governance
        run: python scripts/ois_governance_check.py
      - name: Full test suite
        run: python -m pytest -q
      - name: PostgreSQL RLS adversarial suite
        run: python -m pytest -q tests/integration/test_p0_4_4_rls_adversarial.py
      - name: Redis crash recovery suite
        run: python -m pytest -q tests/integration/test_p0_4_5_crash_recovery.py
      - name: P0 deliberate failure and recovery
        run: python -m pytest -q test_p0_integrated_spine.py

  gvisor-conformance:
    if: ${{ vars.OIS_GVISOR_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, gvisor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest pytest-asyncio
      - name: gVisor sandbox conformance
        env:
          OIS_SANDBOX_RUNTIME: gvisor
        run: python -m pytest -q -m sandbox tests/sandbox/test_gvisor_conformance.py
