name: phase-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-gate-validator:
    name: phase-gate-validator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate strict phase ordering
        run: python scripts/validate_phase_gates.py
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest
      - name: Run phase-gate regression tests
        run: python -m pytest -q tests/governance/test_phase_gates.py

  repository-integrity:
    name: repository-integrity
    needs: phase-gate-validator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check tracked-file whitespace errors
        run: git diff --check
      - name: Compile Python sources
        run: python -m compileall -q ois ops production tests scripts
      - name: Confirm phase contract is present
        run: test -f config/phase-gates.json && test -f docs/implementation-sequence.md
