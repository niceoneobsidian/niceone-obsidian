name: OIS Credential Lifecycle Operations

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "ois/security/secrets/**"
      - "tests/security/**"
      - ".github/workflows/credential-lifecycle.yml"

permissions:
  contents: read

jobs:
  lifecycle-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run lifecycle, recovery, compliance and attack-path regression
        run: pytest -q tests/security/test_lifecycle_ops.py tests/security/test_control_plane_hardening.py
      - name: Scan tracked source for secrets
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --no-banner --redact
          else
            echo "Gitleaks is installed by the dedicated security workflow; this job does not silently substitute a weaker scanner."
          fi
      - name: Repository and configuration drift checks
        run: |
          git fsck --full --strict
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json
          baseline = json.loads(Path("security/credential-control-baseline.json").read_text())
          assert baseline["required_controls"]
          print(f"baseline controls: {len(baseline['required_controls'])}")
          PY
