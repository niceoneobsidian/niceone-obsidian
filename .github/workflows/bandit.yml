name: Bandit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit

      - name: Bandit Scan
        run: bandit -r . -x ./.git,./.venv,./venv,./tests -lll -iii
