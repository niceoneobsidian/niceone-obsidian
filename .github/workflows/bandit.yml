name: Bandit

on:
  push:
    branches: [main, dev/de-03-postgres-fenced-execution]
  pull_request:
    branches: [main, dev/de-03-postgres-fenced-execution]

permissions: {}

concurrency:
  group: ci-bandit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Bandit
        run: python -m pip install --upgrade pip "bandit==1.8.6"

      - name: Bandit Scan
        run: bandit -r . -x ./.git,./.venv,./venv,./tests -lll -iii
