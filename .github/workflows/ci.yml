name: Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, 'feat/**' ]

jobs:
  validate-codebase:
    name: Code Quality & Testing Engine
    runs-on: ubuntu-latest

    services:
      # Spin up Redis background service for integration test specs
      redis:
        image: redis:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Initialize Runtime Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System and Tooling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Step 1 - Check Layout & Formatting Contracts (Ruff)
        run: |
          ruff format . --check
          ruff check .

      - name: Step 2 - Validate Strict Type Contracts (Mypy)
        run: |
          python -m mypy ois

      - name: Step 3 - Execute Test Matrix Regressions (Pytest)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python -m pytest tests/ -v
