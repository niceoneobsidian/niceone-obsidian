name: Ruff Safe Fix Preview

on:
  workflow_dispatch:

permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Preview safe Ruff fixes
        run: ruff check . --fix --diff
