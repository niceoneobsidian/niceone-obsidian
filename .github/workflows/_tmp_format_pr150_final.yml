name: Temporary PR150 final formatter
on:
  push:
    branches:
      - tmp/format-pr150-final
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.9.10"
      - run: python -m ruff format ois/domains/social_intelligence/cross_source.py ois/domains/social_intelligence/evidence.py ois/domains/social_intelligence/outcomes.py ois/domains/social_intelligence/source_validation.py tests/contract/test_social_intelligence_g1_g2_e2e.py
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ois/domains/social_intelligence/cross_source.py ois/domains/social_intelligence/evidence.py ois/domains/social_intelligence/outcomes.py ois/domains/social_intelligence/source_validation.py tests/contract/test_social_intelligence_g1_g2_e2e.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: apply Ruff formatting"
          git push
