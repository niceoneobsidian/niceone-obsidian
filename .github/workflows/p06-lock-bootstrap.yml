name: P0.6 Lock Bootstrap

on:
  push:
    branches:
      - phase-p0.6-security-observability

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.12.17" "ruff==0.9.10"
      - run: ruff check --fix ois/observability_telemetry.py production/telemetry.py
      - run: uv lock
      - run: uv export --frozen --format requirements-txt --hashes --no-emit-project --extra test -o requirements.lock
      - name: Commit generated repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ois/observability_telemetry.py production/telemetry.py uv.lock requirements.lock
          if git diff --cached --quiet; then
            echo "No generated repairs needed."
            exit 0
          fi
          git commit -m "fix: repair P0.6 lint and dependency locks"
          git push origin HEAD:phase-p0.6-security-observability
