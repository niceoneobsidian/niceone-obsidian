name: OIS Environment Fabric
permissions:
  contents: read
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  config-and-safety:
    runs-on: ubuntu-latest
    env:
      OIS_ENVIRONMENT: test
      OIS_CONFIG_PROFILE: test
      OIS_EXTERNAL_APIS_ENABLED: "false"
      OIS_EXTERNAL_READS_ENABLED: "false"
      OIS_EXTERNAL_WRITES_ENABLED: "false"
      OIS_SECRET_PROVIDER: env
      OIS_OBSERVABILITY_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Validate test configuration
        run: python -m ois.config.startup
      - name: Environment contract gate
        run: python scripts/ois_environment_gate.py
      - name: Environment fabric tests
        run: python -m pytest -q tests/test_environment_fabric.py tests/infrastructure/test_oauth2.py
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
