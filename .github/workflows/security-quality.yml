name: OIS Security Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install --upgrade pip && pip install -e ".[test,security]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy ois
      - name: Pytest
        run: pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-conformance:
    runs-on: ubuntu-latest
    needs: [quality, gitleaks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[test,security]"
      - name: Security conformance
        run: pytest -q tests/security
      - name: Emit release evidence
        run: |
          mkdir -p artifacts/security
          printf '{"commit":"%s","ruff":true,"mypy":true,"pytest":true,"gitleaks":true,"conformance":true}\n' "$GITHUB_SHA" > artifacts/security/release-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: ois-security-release-evidence
          path: artifacts/security/release-evidence.json
