name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked build dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install build cyclonedx-bom

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel --outdir dist

      - name: Generate release SBOM
        run: python -m cyclonedx_py environment --of JSON --output-file dist/sbom.cdx.json

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
