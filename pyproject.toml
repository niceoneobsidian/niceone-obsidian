# Canonical OIS Python tooling configuration; TOML regexes use literal-string syntax.
[project]
name = "niceone-obsidian"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]

[tool.ruff.lint.per-file-ignores]
"ois/domains/social_intelligence/inventory.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
exclude = [
  "ois/domains/social_intelligence/inventory.py",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = [
  '^\\.git/',
  '^\\.venv/',
  '^venv/',
  '^build/',
  '^dist/',
  '^\\.mypy_cache/',
  '^\\.pytest_cache/',
  '^\\.ruff_cache/',
]
