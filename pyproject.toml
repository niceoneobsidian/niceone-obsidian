# Canonical OIS Python tooling configuration; TOML regexes use literal-string syntax.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "niceone-obsidian"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.3.4,<4",
  "pydantic>=2.13.5,<3",
  "langgraph>=1.2.11,<2",
  "langgraph-checkpoint-postgres>=3.1.2,<4",
  "redis>=8.1,<9",
  "opentelemetry-api>=1.44,<2",
]

[tool.setuptools.packages.find]
include = ["ois*", "production*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]

[tool.ruff.lint.per-file-ignores]
"ois/domains/social_growth/attribution_store.py" = ["E501"]
"ois/domains/social_growth/evidence.py" = ["E501"]
"ois/domains/social_growth/persistence.py" = ["E501"]
"ois/domains/social_growth/publish_capability.py" = ["E501"]
"ois/kernel/checkpoint.py" = ["E501"]
"ois/kernel/registry.py" = ["E501"]
"ois/kernel/runtime.py" = ["E501"]
"ois/kernel/state.py" = ["E501"]
"ois/runtime/intelligence_fabrics.py" = ["E501"]
"ois/workflows/tiktok_content_vertical_slice.py" = ["E501"]
"ois/control_plane/lifecycle.py" = ["E501"]
"ois/domains/social_intelligence/inventory.py" = ["E501"]
"ois/production/control.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
exclude = [
  "ois/domains/social_intelligence/inventory.py",
]

[tool.pytest.ini_options]
markers = [
  "integration: requires live PostgreSQL or Redis infrastructure",
  "sandbox: must execute inside the OIS gVisor runtime",
  "recovery: deterministic recovery conformance scenarios",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = [
  '^\\.git/',
  '^\\.venv/',
  '^venv/',
  '^build/',
  '^dist/',
  '^\\.mypy_cache/',
  '^\\.pytest_cache/',
  '^\\.ruff_cache/',
]
