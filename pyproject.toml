# Canonical OIS Python tooling configuration; TOML regexes use literal-string syntax.
[project]
name = "niceone-obsidian"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.3.6,<4",
  "psycopg-pool>=3.3.3,<4",
  "langgraph>=1.2.12,<2",
  "langgraph-checkpoint-postgres>=3.1.2,<4",
  "opentelemetry-api>=1.45.0,<2",
  "opentelemetry-sdk>=1.45.0,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.45.0,<2",
  "redis>=8.1,<9",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "psycopg[binary]>=3.3.6,<4",
  "psycopg-pool>=3.3.3,<4",
  "testcontainers[postgres]>=4.15,<5",
  "pytest-asyncio>=1.4.0,<2",
  "ruff==0.16.9",
  "mypy",
  "bandit",
  "pip-licenses",
]
[project.scripts]
ois = "ois.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
  "ois*",
  "ops*",
  "production*",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]

[tool.ruff.lint.per-file-ignores]
"ois/domains/social_intelligence/inventory.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
exclude = [
  "ois/domains/social_intelligence/inventory.py",
]

[tool.pytest.ini_options]
markers = [
  "integration: requires live PostgreSQL or Redis infrastructure",
  "sandbox: must execute inside the OIS gVisor runtime",
  "recovery: deterministic recovery conformance scenarios",
  "live: opt-in read-only live integration verification",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
explicit_package_bases = true
exclude = [
  '^\.git/',
  '^\.venv/',
  '^venv/',
  '^build/',
  '^dist/',
  '^\.mypy_cache/',
  '^\.pytest_cache/',
  '^\.ruff_cache/',
]

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_untyped_defs = false
