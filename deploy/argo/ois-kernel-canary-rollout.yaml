apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ois-hardened-worker-node
  namespace: ois-worker-sandbox
  labels:
    app.kubernetes.io/name: ois-agent-worker
    app.kubernetes.io/component: kernel-execution
spec:
  replicas: 10
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ois-agent-worker
  strategy:
    canary:
      canaryService: ois-worker-canary-svc
      stableService: ois-worker-stable-svc
      trafficRouting:
        nginx:
          stableIngress: ois-kernel-ingress
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - analysis:
            templates:
              - templateName: ois-kernel-telemetry-analysis
            args:
              - name: canary-service
                value: ois-worker-canary-svc.ois-worker-sandbox.svc.cluster.local:8080
              - name: stable-service
                value: ois-worker-stable-svc.ois-worker-sandbox.svc.cluster.local:8080
        - setWeight: 50
        - pause:
            duration: 5m
        - analysis:
            templates:
              - templateName: ois-kernel-telemetry-analysis
            args:
              - name: canary-service
                value: ois-worker-canary-svc.ois-worker-sandbox.svc.cluster.local:8080
              - name: stable-service
                value: ois-worker-stable-svc.ois-worker-sandbox.svc.cluster.local:8080
        - setWeight: 100
  template:
    metadata:
      labels:
        app: ois-agent-worker
        ois.niceone.ai/tier: kernel-execution
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "ois-tenant-worker-role"
        vault.hashicorp.com/agent-inject-secret-supervisor: "secret/data/ois/kernel/signing"
    spec:
      runtimeClassName: gvisor-sandbox
      serviceAccountName: ois-worker-sa
      containers:
        - name: worker-runtime
          image: ois-registry.internal/kernel/worker:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - ". /vault/secrets/supervisor && exec python3 -m ois_worker.run"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ois-worker-stable-svc
  namespace: ois-worker-sandbox
spec:
  selector:
    app: ois-agent-worker
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ois-worker-canary-svc
  namespace: ois-worker-sandbox
spec:
  selector:
    app: ois-agent-worker
  ports:
    - name: http
      port: 8080
      targetPort: http
