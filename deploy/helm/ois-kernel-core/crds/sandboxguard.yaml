apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxguards.ois.kernel.io
spec:
  group: ois.kernel.io
  scope: Namespaced
  names:
    plural: sandboxguards
    singular: sandboxguard
    kind: SandboxGuard
    shortNames:
      - sbg
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
                mode:
                  type: string
                  enum:
                    - read-only
                    - restricted
                    - standard
                allowedPaths:
                  type: array
                  items:
                    type: string
                deniedCommands:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                state:
                  type: string
          additionalProperties: false
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
