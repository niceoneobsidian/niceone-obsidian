apiVersion: v1
kind: ConfigMap
metadata:
  name: ois-prometheus-scrape
  namespace: monitoring
data:
  ois-scrape.yml: |
    scrape_configs:
      - job_name: ois-otel-collector
        metrics_path: /metrics
        static_configs:
          - targets:
              - otel-collector.monitoring.svc.cluster.local:9464
