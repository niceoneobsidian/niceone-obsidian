apiVersion: v1
kind: Pod
metadata:
  name: ois-sandbox
  labels:
    app: ois-sandbox
    ois.niceone.io/sandbox: "true"
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  containers:
    - name: sandbox
      image: ghcr.io/niceoneobsidian/ois-sandbox:latest
      env:
        - name: OIS_SANDBOX_RUNTIME
          value: gvisor
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ois-sandbox-default-deny
spec:
  podSelector:
    matchLabels:
      app: ois-sandbox
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
